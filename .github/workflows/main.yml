name: Kittygram CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  tests:
    name: Статические проверки (settings, infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Run static tests
        run: uv run pytest tests/test_settings.py tests/test_files.py

  deploy:
    name: Деплой на сервер
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      # На сервере ограничен egress до GitHub, поэтому код доставляем
      # напрямую из раннера, а не через git pull на сервере.
      - name: Pack sources
        run: |
          cd ..
          tar czf /tmp/deploy.tgz --exclude='.git' --exclude='.env' infra_sprint1

      - name: Upload sources to server
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          scp -i /tmp/deploy_key -P ${{ secrets.SSH_PORT || 22 }} \
            -o StrictHostKeyChecking=accept-new \
            /tmp/deploy.tgz ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy.tgz

      - name: Apply and restart stack
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd $HOME
            tar xzf /tmp/deploy.tgz
            rm -f /tmp/deploy.tgz
            cd ${{ secrets.PROJECT_DIR }}
            # образы уже собраны и загружены на сервер (registry недоступен из сети ВМ)
            docker compose -f docker-compose.production.yml up -d --no-build
            docker compose -f docker-compose.production.yml exec -T backend \
              python manage.py migrate --noinput
            docker compose -f docker-compose.production.yml exec -T backend \
              python manage.py collectstatic --noinput
            docker image prune -f

  full-check:
    name: Полная проверка живого сайта
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      # даём сервисам подняться после деплоя
      - name: Wait for services
        run: sleep 40

      - name: Run full test suite
        run: uv run pytest tests/
