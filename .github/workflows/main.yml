name: Kittygram CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  tests:
    name: Статические проверки (settings, infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Run static tests
        run: uv run pytest tests/test_settings.py tests/test_files.py

  deploy:
    name: Деплой (сервер сам тянет main) и проверка живого сайта
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Из сети учебной ВМ недоступны registry и SSH из интернета,
      # поэтому деплой pull-based: на сервере systemd-timer раз в минуту
      # скачивает main-тарболл с codeload.github.com и перекатывает стек
      # (скрипт /home/ubuntu/deploy_pull.sh).
      # ВАЖНО: раннеры GitHub (US) не имеют сетевого доступа к учебной ВМ,
      # поэтому проверка живого сайта из CI невозможна — полный прогон
      # тестов по живым сайтам выполняется локально: `uv run pytest tests/`.
      - name: Wait for server pickup
        run: sleep 90

      - name: Deploy info
        run: |
          echo "Сервер заберёт этот коммит (${{ github.sha }}) в течение минуты."
          echo "Живые сайты: https://pavel-kittygram.duckdns.org и https://pavel-taski.duckdns.org"
