name: Kittygram CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  tests:
    name: Статические проверки (settings, infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      - name: Run static tests
        run: uv run pytest tests/test_settings.py tests/test_files.py

  deploy:
    name: Деплой (сервер сам тянет main) и проверка живого сайта
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      # Из сети учебной ВМ недоступны registry и SSH из интернета,
      # поэтому деплой pull-based: на сервере systemd-timer раз в минуту
      # скачивает main-тарболл с codeload.github.com и перекатывает стек
      # (скрипт /home/ubuntu/deploy_pull.sh). Здесь ждём выкатку и проверяем.
      - name: Wait for server pickup
        run: sleep 90

      - name: Verify sites are up
        run: |
          for url in https://pavel-kittygram.duckdns.org/ https://pavel-taski.duckdns.org/; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$url")
            echo "$url -> $code"
            [ "$code" = "200" ] || { echo "FAIL: $url"; exit 1; }
          done

  full-check:
    name: Полная проверка живого сайта
    needs: deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.8"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --python 3.13

      # даём сервисам подняться после деплоя
      - name: Wait for services
        run: sleep 40

      - name: Run full test suite
        run: uv run pytest tests/
